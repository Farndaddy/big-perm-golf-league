# Big Perm Golf League — Auto-Update Workflow
# Runs every Sunday night at 11 PM Central Time (Monday 04:00 UTC)
# Also runnable manually from the Actions tab on GitHub.
#
# What it does:
#   1. Fetches current data from the public Google Sheet (CSV export)
#   2. Runs scripts/update_site.py to update index.html
#   3. If index.html changed, commits and pushes → GitHub Pages auto-deploys

name: Update Site from Google Sheets

on:
  schedule:
    # 04:00 UTC Monday = 11:00 PM Sunday US Central (CDT, UTC-5)
    # Adjust cron if your timezone offset changes (CST is UTC-6 → use 05:00)
    - cron: "0 4 * * 1"

  # Allow manual trigger from GitHub → Actions tab → Run workflow
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Run update script ──────────────────────────────────────────────
      - name: Update site from Google Sheets
        run: python3 scripts/update_site.py

      # ── 4. Commit & push if anything changed ──────────────────────────────
      - name: Commit and push changes
        run: |
          git config user.name  "Big Perm Bot"
          git config user.email "bot@bigpermgolf.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit — sheet data unchanged since last update."
          else
            ROUND=$(grep -oP 'Round \K\d+(?= of)' index.html | head -1)
            git commit -m "Auto-update: Round ${ROUND} data from Google Sheets [skip ci]"
            git push
          fi
